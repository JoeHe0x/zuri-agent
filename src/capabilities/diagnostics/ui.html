<div id="logs-panel" class="tab-panel hidden zuri-scroll">
      <div class="logs-toolbar zuri:flex zuri:items-center zuri:flex-wrap zuri:gap-2">
        <button id="btn-refresh-logs" class="zuri-btn zuri-btn--secondary" data-i18n="diagnostics.refresh">刷新</button>
        <button id="btn-clear-logs" class="zuri-btn zuri-btn--secondary" data-i18n="diagnostics.clear">清空</button>
        <button id="btn-clear-landing-history" class="zuri-btn zuri-btn--secondary" type="button" data-i18n="diagnostics.clearLandingHistory">清除 Landing 历史</button>
        <span id="logs-action-status" class="logs-action-status zuri:ml-auto" role="status" aria-live="polite"></span>
      </div>
      <pre id="logs-content" class="logs-content zuri:flex-1 zuri:m-0 zuri:overflow-auto zuri:whitespace-pre-wrap"></pre>
    </div>
