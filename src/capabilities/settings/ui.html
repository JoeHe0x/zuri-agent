<template id="settings-ui-template">
    <dialog id="model-preset-switcher" class="model-preset-switcher zuri:fixed zuri:w-full zuri:h-full zuri:m-0 zuri:overflow-hidden" aria-label="切换模型" data-i18n-aria-label="settings.switchModel">
      <section class="model-preset-switcher-panel zuri:grid zuri:overflow-hidden">
        <div class="model-preset-switcher-search zuri:grid zuri:items-center zuri:min-h-10 zuri:m-0">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.35"/>
            <path d="M10.2 10.2L13.3 13.3" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
          </svg>
          <input
            id="model-preset-switcher-input"
            class="zuri-field zuri-field--bare"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="搜索已配置模型"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="model-preset-switcher-list"
            aria-expanded="false"
           data-i18n-placeholder="settings.searchConfiguredModels">
        </div>
        <div id="model-preset-switcher-list" class="zuri-menu model-preset-switcher-list zuri:min-h-12" role="listbox"></div>
        <footer class="model-preset-switcher-footer zuri:flex zuri:items-center zuri:justify-between zuri:gap-2.5">
          <span id="model-preset-switcher-status" class="model-preset-switcher-status zuri:min-w-0" role="status" aria-live="polite"></span>
          <span class="model-preset-switcher-hints" aria-hidden="true"><span class="zuri:whitespace-nowrap"><kbd>↑↓</kbd> <span data-i18n="settings.select">选择</span></span> <span class="zuri:whitespace-nowrap"><kbd>Enter</kbd> <span data-i18n="settings.switch">切换</span></span> <span class="zuri:whitespace-nowrap"><kbd>Esc</kbd> <span data-i18n="core.close">关闭</span></span></span>
        </footer>
      </section>
    </dialog>

<div id="settings-section-content" hidden>
        <div id="settings-panel-model" class="settings-body settings-tab-panel" role="tabpanel" aria-labelledby="settings-tab-model" data-settings-panel="model">
          <label class="zuri-field-label" data-i18n="settings.currentPreset">当前</label>
          <div class="settings-preset-row zuri:grid zuri:gap-1.5 zuri:items-center">
            <select id="cfg-preset" class="zuri-field zuri-select">
              <option value="" data-i18n="settings.newConfiguration">新配置</option>
            </select>
            <button id="btn-delete-preset" class="zuri-btn zuri-btn--secondary zuri-btn--danger " type="button" data-i18n="settings.delete">删除</button>
          </div>
          <span id="cfg-provider-label" class="zuri-field-label" data-i18n="settings.provider">服务商</span>
          <select id="cfg-provider" hidden aria-hidden="true" tabindex="-1"></select>
          <button id="cfg-provider-trigger" type="button" class="zuri-field zuri-select provider-picker-trigger" popovertarget="cfg-provider-picker" aria-haspopup="dialog" aria-expanded="false" aria-controls="cfg-provider-picker" aria-labelledby="cfg-provider-label cfg-provider-value">
            <span id="cfg-provider-value" dir="auto"></span>
          </button>
          <div id="cfg-provider-endpoint" class="provider-endpoint" dir="ltr" hidden></div>
          <div id="cfg-provider-picker" class="zuri-popover provider-picker" popover="auto" role="dialog" aria-labelledby="cfg-provider-label">
            <div class="provider-picker-search">
              <input id="cfg-provider-search" class="zuri-field" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cfg-provider-list" data-i18n-placeholder="settings.searchProviders" data-i18n-aria-label="settings.searchProviders" placeholder="搜索服务商" aria-label="搜索服务商">
            </div>
            <div id="cfg-provider-list" class="zuri-menu zuri-scroll provider-picker-list" role="listbox" aria-labelledby="cfg-provider-label"></div>
            <div id="cfg-provider-empty" class="provider-picker-empty" role="status" data-i18n="settings.noProvidersFound" hidden>未找到服务商</div>
          </div>
          <div id="cfg-apikey-field" class="settings-field zuri:gap-1.5">
            <div class="settings-field-label-row zuri:flex zuri:items-center zuri:justify-between zuri:gap-2">
              <label class="zuri-field-label" data-i18n="settings.apiKey">API 密钥</label>
            </div>
            <input id="cfg-apikey" type="password" class="zuri-field" placeholder="sk-...">
          </div>
          <div id="product-model-settings" style="display:contents"></div>
          <div id="provider-auth-box" class="provider-auth-box hidden zuri:grid zuri:gap-1.5">
            <div class="provider-auth-row zuri:grid zuri:items-center zuri:gap-1.5">
              <span id="provider-auth-status" class="provider-auth-status zuri:min-w-0 zuri:overflow-hidden zuri:whitespace-nowrap" data-i18n="settings.notSignedIn">未登录</span>
              <button id="btn-provider-login" class="zuri-btn zuri-btn--secondary " type="button" data-i18n="settings.signIn">登录</button>
              <button id="btn-provider-logout" class="zuri-btn zuri-btn--secondary zuri-btn--danger " type="button" data-i18n="settings.signOut">退出登录</button>
            </div>
            <div id="provider-device-box" class="provider-device-box hidden zuri:grid zuri:gap-1.5 zuri:items-center">
              <div id="provider-device-code" class="provider-device-code zuri:min-w-0"></div>
              <div id="provider-device-hint" class="zuri-field-hint"></div>
              <button id="btn-provider-open" class="zuri-btn zuri-btn--secondary " type="button" data-i18n="settings.openSignInPage">打开登录页</button>
            </div>
          </div>
          <div id="provider-options-box" class="provider-options-box hidden zuri:grid zuri:gap-1.5"></div>
          <div id="custom-provider-box" class="custom-provider-box hidden zuri:grid">
            <label class="custom-option-row zuri:grid">
              <span data-i18n="settings.protocol">协议</span>
              <select id="cfg-custom-protocol" class="zuri-field zuri-select">
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic</option>
              </select>
            </label>
            <label class="custom-option-row zuri:grid">
              <span data-i18n="settings.presetName">预设名称</span>
              <input id="cfg-custom-preset-name" type="text" class="zuri-field" placeholder="我的接口" data-i18n-placeholder="settings.myEndpoint">
            </label>
            <div class="custom-option-row full zuri:grid">
              <label for="cfg-custom-endpoint" data-i18n="settings.endpointUrl">接口地址</label>
              <div class="custom-endpoint-editor zuri:relative zuri:min-w-0">
                <input
                  id="cfg-custom-endpoint"
                  type="url"
                  class="zuri-field custom-endpoint-input zuri:w-full"
                  placeholder="https://example.com/v1/chat/completions"
                  autocomplete="off"
                  inputmode="url"
                  spellcheck="false"
                  aria-autocomplete="inline"
                >
                <span
                  id="cfg-custom-endpoint-completion"
                  class="custom-endpoint-inline-completion hidden zuri:absolute zuri:flex zuri:items-center zuri:whitespace-nowrap"
                  aria-hidden="true"
                ></span>
              </div>
            </div>
          </div>
          <label class="zuri-field-label" data-i18n="settings.modelName">模型名称</label>
          <div id="cfg-model-combobox" class="zuri-combobox model-combobox">
            <input
              id="cfg-model"
              type="text"
              class="zuri-field zuri-field--mono zuri-combobox-input model-combobox-input"
              placeholder="选择或输入模型名"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="cfg-model-options"
             data-i18n-placeholder="settings.selectOrEnterAModelName">
            <button id="cfg-model-clear" class="zuri-icon-btn zuri-icon-btn--sm zuri-combobox-clear model-combobox-clear hidden" type="button" aria-label="清空模型名" tabindex="-1" data-i18n-aria-label="settings.clearModelName">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M4.25 4.25l5.5 5.5M9.75 4.25l-5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
            <button id="cfg-model-toggle" class="zuri-icon-btn zuri-icon-btn--sm zuri-combobox-toggle model-combobox-toggle" type="button" aria-label="展开模型列表" tabindex="-1" data-i18n-aria-label="settings.showModelList">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M3.5 5.25L7 8.75l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="cfg-model-options" class="zuri-popover zuri-menu zuri-combobox-menu model-suggestions hidden" role="listbox" popover="manual"></div>
          </div>
          <label class="zuri-field-label" data-i18n="settings.contextLength">上下文长度</label>
          <div class="context-window-box zuri:grid zuri:gap-0">
            <select id="cfg-context-preset" class="zuri-field zuri-select context-window-select" aria-label="上下文长度" data-i18n-aria-label="settings.contextLength"></select>
            <input id="cfg-context-window" type="text" class="zuri-field context-window-input hidden zuri:h-8.5" placeholder="262K / 1M / 200000">
          </div>
          <label class="settings-model-capability-field zuri:grid">
            <span class="zuri-field-label" data-i18n="settings.imageSupport">支持图片</span>
            <select id="cfg-vision" class="zuri-field zuri-select">
              <option value="false" data-i18n="settings.no">否</option>
              <option value="true" data-i18n="settings.yes">是</option>
            </select>
          </label>
          <section class="model-parameters-editor zuri:grid" aria-label="自定义参数" data-i18n-aria-label="settings.customParameters">
            <span id="cfg-model-parameters-label" class="zuri-field-label hidden" data-i18n="settings.customParameters">自定义参数</span>
            <div id="cfg-model-parameters" class="model-parameter-list zuri:gap-1.5"></div>
            <button id="btn-add-model-parameter" class="zuri-btn zuri-btn--ghost zuri-btn--inline model-parameter-add" type="button" data-i18n="settings.addCustomParameter">＋ 添加自定义参数</button>
          </section>
          <div id="cfg-model-parameter-suggestions" class="zuri-popover zuri-menu model-parameter-suggestions hidden zuri:fixed zuri:m-0" role="listbox" popover="manual"></div>
        </div>
        <div id="settings-panel-skills" class="settings-body settings-tab-panel hidden" role="tabpanel" aria-labelledby="settings-tab-skills" data-settings-panel="skills">
          <div id="skill-settings-list" class="skill-settings-list zuri:grid zuri:w-full zuri:gap-2.5" aria-live="polite">
            <div class="skill-settings-empty zuri:grid zuri:min-h-37.5 zuri:gap-2.5" data-i18n="settings.loadingSkillSettings">正在读取 Skill 设置…</div>
          </div>
        </div>
        <div id="settings-panel-advanced" class="settings-body settings-tab-panel hidden" role="tabpanel" aria-labelledby="settings-tab-advanced" data-settings-panel="advanced">
          <section class="advanced-section zuri:grid zuri:gap-2" aria-label="高级设置" data-i18n-aria-label="settings.advancedSettings">
            <div id="cfg-trim-old-tool-results-field" class="hidden" aria-hidden="true">
              <label class="settings-toggle-row zuri:flex zuri:items-center zuri:justify-between zuri:gap-3 zuri:min-h-8">
                <span class="advanced-setting-title" data-i18n="settings.trimOldContext">历史上下文裁剪</span>
                <input id="cfg-trim-old-tool-results" class="zuri-checkbox" type="checkbox">
              </label>
              <div class="zuri-field-hint settings-advanced-hint" data-i18n="settings.removeOlderToolResultsImagesAndOtherHistoryToUse">清理多轮之前的工具结果、图片等历史内容，提高上下文利用率。长上下文模型可以关闭以提高缓存命中率。</div>
            </div>
            <label class="settings-toggle-row zuri:flex zuri:items-center zuri:justify-between zuri:gap-3 zuri:min-h-8">
              <span class="advanced-setting-title" data-i18n="settings.floatingBall">悬浮球</span>
              <input id="cfg-floating-ball" class="zuri-checkbox" type="checkbox">
            </label>
            <label class="settings-toggle-row hidden zuri:flex zuri:items-center zuri:justify-between zuri:gap-3 zuri:min-h-8" aria-hidden="true">
              <span class="advanced-setting-title" data-i18n="settings.debugMode">调试模式</span>
              <input id="cfg-debug-mode" class="zuri-checkbox" type="checkbox">
            </label>
          </section>
          <section class="advanced-section guardrail-section zuri:grid zuri:gap-2" aria-label="安全策略" data-i18n-aria-label="settings.securityPolicies">
            <div class="advanced-section-header zuri:grid zuri:gap-1">
              <div class="advanced-setting-title" data-i18n="settings.securityPolicies">安全策略</div>
            </div>
            <div class="guardrail-form zuri:grid zuri:gap-2" aria-label="新增访问规则" data-i18n-aria-label="settings.newAccessRule">
              <div class="guardrail-form-header zuri:flex zuri:items-baseline zuri:min-w-0">
                <div class="guardrail-form-title zuri:shrink-0" data-i18n="settings.newRule">新增规则</div>
                <div id="guardrail-allow-hint" class="guardrail-form-hint hidden zuri:flex-1 zuri:min-w-0" data-i18n="settings.allowAccessCreatesExceptionsToBlockRulesOrdinaryAccessNeeds">“允许访问”用于反向加白，普通访问无需配置。</div>
              </div>
              <div class="guardrail-add-row zuri:grid zuri:gap-2">
                <div class="guardrail-filter-row zuri:grid-cols-2">
                  <select id="guardrail-rule-action" class="zuri-field zuri-select guardrail-rule-action" aria-label="访问动作" data-i18n-aria-label="settings.accessAction">
                    <option value="block" data-i18n="settings.blockAccess">禁止访问</option>
                    <option value="allow" data-i18n="settings.allowAccess">允许访问</option>
                    <option value="rate_limit" data-i18n="settings.rateLimit">流控</option>
                  </select>
                  <select id="guardrail-rule-type" class="zuri-field zuri-select guardrail-rule-type" aria-label="规则类型" data-i18n-aria-label="settings.ruleType">
                    <option value="domain" data-i18n="settings.domain">域名</option>
                    <option value="pattern" data-i18n="settings.wildcardMatch">模糊匹配</option>
                  </select>
                </div>
                <div class="guardrail-input-row">
                  <input id="guardrail-domain-input" type="text" class="zuri-field" placeholder="example.com" autocomplete="off">
                  <div id="guardrail-rate-limit-field" class="guardrail-rate-limit-field hidden zuri:relative zuri:min-w-0">
                    <input id="guardrail-rate-limit-interval" type="number" class="zuri-field guardrail-rate-limit-interval zuri:min-w-0 zuri:w-full zuri:pe-7.5" min="0.5" max="86400" step="0.5" inputmode="decimal" placeholder="3" autocomplete="off" aria-label="最小打开间隔秒数" data-i18n-aria-label="settings.minimumNavigationIntervalInSeconds">
                    <span class="guardrail-rate-limit-unit zuri:absolute" aria-hidden="true" data-i18n="settings.seconds">秒</span>
                  </div>
                  <button id="btn-add-guardrail-domain" class="zuri-btn zuri-btn--secondary " type="button" data-i18n="settings.add">添加</button>
                </div>
              </div>
              <div id="guardrail-status" class="settings-inline-status hidden" role="status" aria-live="polite"></div>
            </div>
            <div class="guardrail-list-title zuri:mt-1" data-i18n="settings.configuredRules">已配置规则</div>
            <div id="guardrail-domain-list" class="guardrail-domain-list zuri:grid zuri:gap-1.5"></div>
          </section>
        </div>
</div>
</template>
<template id="settings-onboarding-template">
        <section class="welcome-onboarding" aria-label="建议任务" data-i18n-aria-label="settings.suggestedTasks">
          <h2 data-i18n="settings.startWithASmallTask">先从一个小任务开始</h2>
          <p class="onboarding-copy" data-i18n="settings.chooseAScenarioToPutADraftInTheMessage">选一个场景，我会把任务草稿放进输入框；你确认后再发送。</p>
          <div id="onboarding-status" class="onboarding-status zuri:grid zuri:items-center zuri:gap-2 zuri:min-h-8.5 zuri:mb-2.5" data-state="loading">
            <span class="onboarding-status-dot" aria-hidden="true"></span>
            <span id="onboarding-status-text" data-i18n="settings.checkingModelConfiguration">正在检查模型配置</span>
          </div>
          <div id="onboarding-setup-actions" class="onboarding-setup-actions hidden zuri:grid zuri:gap-2 zuri:mb-2.5">
            <button id="onboarding-primary-btn" class="zuri-btn zuri-btn--primary zuri-btn--lg onboarding-primary-btn zuri:w-full" type="button" data-onboarding-action="setup" data-i18n="settings.configureModelEndpoint">配置模型接口</button>
          </div>
          <div class="onboarding-actions zuri:grid zuri:gap-1.5">
            <button type="button" class="onboarding-action zuri:grid zuri:gap-0.5 zuri:w-full zuri:min-h-12.5" data-onboarding-action="summarize">
              <span data-i18n="settings.summarizePageTitle">世界主要城市未来 7 天天气</span>
              <small data-i18n="settings.summarizePageDescription">整理成一份 Excel 文件</small>
            </button>
            <button type="button" class="onboarding-action zuri:grid zuri:gap-0.5 zuri:w-full zuri:min-h-12.5" data-onboarding-action="extract">
              <span data-i18n="settings.compareOptionsTitle">大模型后训练最新科研成果综述</span>
              <small data-i18n="settings.compareOptionsDescription">整理近期论文和关键进展</small>
            </button>
            <button type="button" class="onboarding-action zuri:grid zuri:gap-0.5 zuri:w-full zuri:min-h-12.5" data-onboarding-action="assist">
              <span data-i18n="settings.researchTopicTitle">今天网上最火的新闻是啥</span>
              <small data-i18n="settings.researchTopicDescription">帮我抓几个真正值得看的热点</small>
            </button>
            <button type="button" class="onboarding-action zuri:grid zuri:gap-0.5 zuri:w-full zuri:min-h-12.5" data-onboarding-action="skill">
              <span data-i18n="settings.createWebsiteSkillTitle">给 Hacker News 生成站点 Skill</span>
              <small data-i18n="settings.createWebsiteSkillDescription">让Zuri学会搜索帖子、阅读评论和查看作者</small>
            </button>
          </div>
        </section>
</template>
<template id="settings-notices-template"><div id="gpt-connect-hint" class="input-network-hint hidden zuri:items-center zuri:overflow-hidden zuri:whitespace-nowrap" aria-live="polite"></div></template>
<template id="settings-model-template"><span id="current-model-indicator" class="model-menu hidden zuri:min-w-0"><button type="button" class="model-menu-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="切换模型" data-i18n-aria-label="settings.switchModel"></button><div class="model-menu-list zuri-popover hidden" role="listbox"></div></span></template>
